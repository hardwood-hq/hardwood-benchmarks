# The AWS SDK bundle hadoop-aws brings logs its HTTP client through Log4j 1.x. Unconfigured,
# Log4j runs at DEBUG and formats a message per request; WARN keeps that out of the S3 write
# benchmark's timing.
log4j.rootLogger=WARN, stderr
log4j.appender.stderr=org.apache.log4j.ConsoleAppender
log4j.appender.stderr.Target=System.err
log4j.appender.stderr.layout=org.apache.log4j.PatternLayout
log4j.appender.stderr.layout.ConversionPattern=%p %c: %m%n
